<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meilang Student Webpage aaaa</title>
    <link rel="icon" href="/images-1/releaffavicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">

</head>

<body>
    <div class="header">
        <h1>Practice Webpage</h1>
        <p>Student Name: Meilang</p>
    </div>
    <div class="card">
        <h2>Image Section</h2>
        <img src="/images-1/Ireland.webp" alt="ireland-scenic-view" class="img-regular">
    </div>
    <div class="card">
        <h2>Image Circle</h2>
        <img src="/images-1/Ireland.webp" alt="ireland-scenic-view-circle" class="img-circle">
    </div>
    <div class="card">
        <h2>Image Oval</h2>
        <img src="/images-1/Ireland.webp" alt="ireland-scenic-view-oval" class="img-oval">
    </div>


    <div class="card">
        <h2>Advanced Table</h2>
        <table border="1">
            <thead>
                <tr>
                    <th rowspan="2">Name</th>
                    <th colspan="2">Score</th>
                    <th rowspan="2">Grade</th>
                </tr>
                <tr>
                    <th>Math</th>
                    <th>CS</th>
            </thead>
            <tbody>
                </tr>
                <tr>
                    <td>Alice</td>
                    <td>90</td>
                    <td>95</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Bob</td>
                    <td>80</td>
                    <td>85</td>
                    <td>B</td>
                </tr>
            </tbody>
        </table>
    </div>


    <div class="card">
        <div class="form-container">
            <form>
                <h2>Form 1: Basic Info</h2>
                <div>
                    <label for="name">Name <span class="required">*</span></label>
                </div>
                <div>
                    <input type="text" id="name" name="name" required>
                </div>

                <div>
                    <label for="email">Email <span class="required">*</span></label>
                </div>
                <div>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="password">Password <span class="required">*</span></label>
                </div>
                <div>
                    <input type="password" id="password" name="password" required>
                </div>

                <div>
                    <label for="upload-file">Upload File</label>
                </div>
                <div>
                    <input type="file">
                </div>

                <div>
                    <input type="submit" value="Submit" class="buttonsubmit">
                    <input type="reset" value="Reset" class="buttonreset">
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="form-container">
            <form>
                <h2>Form 2: Survey Form</h2>
                <div>
                    <label for="choosecourse">Choose Course <span class="required">*</span></label>
                </div>

                <div>
                    <select name="course" id="course" required>
                        <option value="">--Select--</option>
                        <option value="wd.uxui">Web Development & UXUI Design</option>
                        <option value="digitalmarketing">Digital Marketing</option>
                        <option value="entrepreneurship">Entrepreneurship</option>
                    </select>
                </div>

                <div>
                    <label for="gender">Gender</label>
                </div>
                <div>
                    <div class="inline-group">
                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                    </div>
                </div>

                <div>
                    <label for="skills">Skills</label>
                </div>
                <div>
                    <div class="inline-group">
                        <input type="checkbox" id="html" name="skills" value="HTML">
                        <label for="html">HTML</label>
                        <input type="checkbox" id="css" name="skills" value="CSS">
                        <label for="css">CSS</label>
                        <input type="checkbox" id="js" name="skills" value="JS">
                        <label for="js">JS</label>
                    </div>
                </div>

                <div>
                    <label for="phone">Phone <span class="required">*</span></label>
                </div>
                <div>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div>
                    <label for="message">Message</label>
                </div>
                <div>
                    <textarea name="message" id="message"></textarea>
                </div>

                <div>
                    <input type="submit" value="Send" class="buttonsubmit">
                </div>
            </form>
        </div>
    </div>
</body>

</html>
